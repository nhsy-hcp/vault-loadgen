name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: run tests
        run: go test -v -race ./...

      - name: build release binaries
        run: |
          # create release directory
          mkdir -p ./release

          # define version from tag
          VERSION=${GITHUB_REF#refs/tags/}
          echo "Building version: $VERSION"

          # build for multiple platforms
          platforms=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
          )

          for platform in "${platforms[@]}"; do
            GOOS=${platform%/*}
            GOARCH=${platform#*/}

            output_name="vault-loadgen-${VERSION}-${GOOS}-${GOARCH}"
            if [ "$GOOS" = "windows" ]; then
              output_name="${output_name}.exe"
            fi

            echo "Building for ${GOOS}/${GOARCH}..."
            GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=0 go build \
              -ldflags="-s -w -X github.com/nhsy/vault-loadgen/internal/version.Version=${VERSION}" \
              -o "./release/${output_name}" \
              ./cmd/vault-loadgen

            # create compressed archives
            if [ "$GOOS" = "windows" ]; then
              # create zip for windows platforms
              zip -j "./release/${output_name}.zip" "./release/${output_name}"
              sha256sum "./release/${output_name}.zip" > "./release/${output_name}.zip.sha256"
              rm "./release/${output_name}"
            else
              # create tar.gz for non-windows platforms
              tar -czf "./release/${output_name}.tar.gz" -C ./release "${output_name}"
              sha256sum "./release/${output_name}.tar.gz" > "./release/${output_name}.tar.gz.sha256"
              rm "./release/${output_name}"
            fi
          done

          # create checksums file (exclude individual .sha256 files)
          cd ./release
          sha256sum *.tar.gz *.zip 2>/dev/null > checksums.txt || true
          cd ..

      - name: upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: ./release/
          retention-days: 5

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release/*.tar.gz
            ./release/*.zip
            ./release/*.sha256
            ./release/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}